apply plugin: 'com.android.application'

android {
    namespace "vaddempudi.gnanesh.syntaxcli"
    compileSdk 34

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        debug {
        }
    }

    defaultConfig {
        applicationId "vaddempudi.gnanesh.syntaxcli"
        minSdk 32
        targetSdk 34
        versionCode 301
        versionName "v6.15.1-updated-v2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            // Explicitly use the debug keystore — NOT the release keystore.
            signingConfig signingConfigs.debug
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            // Leave minify off for now — you're building debug, and turning
            // R8 on just slows the build. Re-enable once playback is fixed.
            minifyEnabled false
            shrinkResources false
            // signingConfig deliberately omitted — unsigned release.
            // Nothing references release.jks anymore.
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // ── Flavors kept exactly as they were ───────────────────────────
    flavorDimensions = ["default"]
    productFlavors {
        fdroid {
            dimension "default"
        }
        playstore {
            dimension "default"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "androidx.webkit:webkit:1.12.0"
    implementation "androidx.media:media:1.7.0"
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'it.andreuzzi:CompareString2:1.0.9'
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-common:1.4.1"
}